services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teacher
      POSTGRES_PASSWORD: teacher_dev
      POSTGRES_DB: teacher_hub
    ports:
      - "5432:5432"
    volumes:
      - e_guro_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teacher -d teacher_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  e_guro_data:
